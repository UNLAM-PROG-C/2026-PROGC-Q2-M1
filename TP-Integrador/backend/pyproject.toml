# Configuración de herramientas del backend (no es un paquete instalable).

[tool.ruff]
# CLAUDE.md: 2 espacios de indentación.
indent-width = 2
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Errores, imports, nombres (pep8-naming), docstrings, modernización y bugbear.
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# En los tests el nombre de la función ya describe el caso.
"tests/**" = ["D"]

[tool.ruff.format]
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
